server.port=8081
spring.thymeleaf.cache=false

# ── Phase 14 (Option A) — Sentry SDK + structured stdout ──────────────
# DSN is empty by default so the SDK is a no-op until you set it via
# PersonalPortfolio/.env.shared. `service` tag distinguishes the PROP
# backend from other demos in the shared Sentry project.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local-dev}
sentry.release=${SENTRY_RELEASE:local-dev}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:1.0}
sentry.send-default-pii=false
sentry.tags.service=prop
