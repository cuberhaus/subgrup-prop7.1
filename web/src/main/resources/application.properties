server.port=8081
spring.thymeleaf.cache=false

# ── Phase 14 (Option A) — Sentry SDK + structured stdout ──────────────
# DSN is empty by default so the SDK is a no-op until you set it via
# PersonalPortfolio/.env.shared. `service` tag distinguishes the PROP
# backend from other demos in the shared Sentry project.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local-dev}
sentry.release=${SENTRY_RELEASE:local-dev}
# Spring properties can't express env-aware defaults inline (no SpEL access
# to SENTRY_ENVIRONMENT here without extra config), so the default below is
# production-safe (0.1). `scripts/dev-all-demos.sh` always exports
# SENTRY_TRACES_SAMPLE_RATE=1.0 for local dev so the high-signal value
# wins during development; bare `mvn spring-boot:run` in production picks
# up the safer 0.1 fallback.
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
sentry.send-default-pii=false
sentry.tags.service=prop
