<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Valoracions</title></head>
<body>
<div layout:fragment="content">
    <h1 class="page-title">Valoracions</h1>
    <p class="page-subtitle">
        <span th:if="${existeixTipusItem}">Tipus d'ítem seleccionat: <span class="badge badge-accent" th:text="${tipusItemNom}"></span></span>
        <span th:unless="${existeixTipusItem}">No hi ha cap tipus d'ítem seleccionat. <a href="/tipus-item" class="text-decoration-none" style="color: var(--accent);">Selecciona'n un</a>.</span>
    </p>

    <div th:if="${existeixTipusItem}" class="row g-4">
        <!-- Actions -->
        <div class="col-md-4">
            <div class="card p-4 mb-4">
                <h5 class="text-white mb-3">Afegir valoració</h5>
                <form th:action="@{/valoracions/afegir}" method="post">
                    <div class="mb-2">
                        <input type="text" name="usuariId" class="form-control form-control-sm" placeholder="Id Usuari" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" name="itemId" class="form-control form-control-sm" placeholder="Id Ítem" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" name="valor" class="form-control form-control-sm" placeholder="Valor" required>
                    </div>
                    <button class="btn btn-accent btn-sm w-100">Afegir</button>
                </form>
            </div>

            <div class="card p-4 mb-4">
                <h5 class="text-white mb-3">Editar valoració</h5>
                <form th:action="@{/valoracions/editar}" method="post">
                    <div class="mb-2">
                        <input type="text" name="usuariId" class="form-control form-control-sm" placeholder="Id Usuari" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" name="itemId" class="form-control form-control-sm" placeholder="Id Ítem" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" name="valor" class="form-control form-control-sm" placeholder="Nou Valor" required>
                    </div>
                    <button class="btn btn-outline-accent btn-sm w-100">Editar</button>
                </form>
            </div>

            <div class="card p-4">
                <h5 class="text-white mb-3">Esborrar</h5>
                <form th:action="@{/valoracions/esborrar}" method="post" class="mb-3">
                    <div class="mb-2">
                        <input type="text" name="usuariId" class="form-control form-control-sm" placeholder="Id Usuari" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" name="itemId" class="form-control form-control-sm" placeholder="Id Ítem" required>
                    </div>
                    <button class="btn btn-outline-danger btn-sm w-100">Esborra valoració</button>
                </form>
                <form th:action="@{/valoracions/esborrar-totes}" method="post"
                      onsubmit="return confirm('Segur que vols esborrar totes les valoracions?');">
                    <button class="btn btn-outline-danger btn-sm w-100">Esborra totes</button>
                </form>
            </div>
        </div>

        <!-- Table -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header p-3">Llista de valoracions</div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr><th>Id Usuari</th><th>Id Ítem</th><th>Valoració</th></tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(valoracions)}">
                                <td colspan="3" class="text-center text-muted py-4">No hi ha cap valoració.</td>
                            </tr>
                            <tr th:each="v : ${valoracions}">
                                <td th:text="${v[0]}"></td>
                                <td th:text="${v[1]}"></td>
                                <td th:text="${v[2]}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
