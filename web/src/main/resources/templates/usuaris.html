<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Usuaris</title></head>
<body>
<div layout:fragment="content">
    <h1 class="page-title">Usuaris</h1>
    <p class="page-subtitle">Gestiona els usuaris i les sessions del sistema.</p>

    <div class="row g-4">
        <!-- Session card -->
        <div class="col-md-4">
            <div class="card p-4 mb-4">
                <h5 class="text-white mb-3">Sessió</h5>
                <div th:if="${sessioIniciada}" class="mb-3">
                    <span class="badge" style="background: rgba(80,200,120,.15); color: #50c878; font-size: 0.9rem;">Sessió activa</span>
                    <form th:action="@{/usuaris/tancar-sessio}" method="post" class="mt-3">
                        <button class="btn btn-outline-danger btn-sm w-100">Tancar sessió</button>
                    </form>
                </div>
                <div th:unless="${sessioIniciada}">
                    <p class="text-muted mb-3">Sessió no iniciada</p>
                    <form th:action="@{/usuaris/iniciar-sessio}" method="post">
                        <div class="mb-2">
                            <input type="text" name="id" class="form-control form-control-sm" placeholder="Id d'usuari" required>
                        </div>
                        <div class="mb-2">
                            <input type="password" name="contrasenya" class="form-control form-control-sm" placeholder="Contrasenya" required>
                        </div>
                        <button class="btn btn-accent btn-sm w-100">Iniciar sessió</button>
                    </form>
                </div>
            </div>

            <!-- Add user -->
            <div class="card p-4 mb-4">
                <h5 class="text-white mb-3">Afegir usuari</h5>
                <form th:action="@{/usuaris/afegir}" method="post">
                    <div class="mb-2">
                        <input type="text" name="nom" class="form-control form-control-sm" placeholder="Nom" required>
                    </div>
                    <div class="mb-2">
                        <input type="password" name="contrasenya" class="form-control form-control-sm" placeholder="Contrasenya" required>
                    </div>
                    <button class="btn btn-accent btn-sm w-100">Afegir</button>
                </form>
            </div>

            <!-- Edit user -->
            <div class="card p-4 mb-4">
                <h5 class="text-white mb-3">Editar usuari</h5>
                <form th:action="@{/usuaris/editar}" method="post">
                    <div class="mb-2">
                        <input type="text" name="id" class="form-control form-control-sm" placeholder="Id d'usuari" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" name="nom" class="form-control form-control-sm" placeholder="Nou nom">
                    </div>
                    <div class="mb-2">
                        <input type="password" name="contrasenya" class="form-control form-control-sm" placeholder="Nova contrasenya">
                    </div>
                    <button class="btn btn-outline-accent btn-sm w-100">Editar</button>
                </form>
            </div>

            <!-- Delete user -->
            <div class="card p-4">
                <h5 class="text-white mb-3">Esborrar</h5>
                <form th:action="@{/usuaris/esborrar}" method="post" class="mb-2">
                    <div class="d-flex gap-2">
                        <input type="text" name="id" class="form-control form-control-sm" placeholder="Id d'usuari" required>
                        <button class="btn btn-outline-danger btn-sm">Esborra</button>
                    </div>
                </form>
                <form th:action="@{/usuaris/esborrar-tots}" method="post"
                      onsubmit="return confirm('Segur que vols esborrar tots els usuaris?');">
                    <button class="btn btn-outline-danger btn-sm w-100">Esborra tots</button>
                </form>
            </div>
        </div>

        <!-- Users table -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header p-3">Llista d'usuaris</div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr><th>Nom</th><th>ID</th><th>Actiu</th></tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(usuaris)}">
                                <td colspan="3" class="text-center text-muted py-4">No hi ha cap usuari.</td>
                            </tr>
                            <tr th:each="u : ${usuaris}" th:if="${!#lists.isEmpty(usuaris)}">
                                <td th:text="${u[0]}"></td>
                                <td th:text="${u[1]}"></td>
                                <td>
                                    <span th:if="${u.size() > 2 and u[2] == 'true'}" class="badge" style="background: rgba(80,200,120,.15); color: #50c878;">Actiu</span>
                                    <span th:if="${u.size() > 2 and u[2] != 'true'}" class="text-muted">Inactiu</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
