name: Tests

on:
  push:
    branches: [master]
    paths:
      - web/**
      - FONTS/**
      - Makefile
      - .github/workflows/test.yml
  pull_request:
    branches: [master]
    paths:
      - web/**
      - FONTS/**
      - Makefile
      - .github/workflows/test.yml

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: web/pom.xml

      - name: Run tests
        run: make -C .. web-test
